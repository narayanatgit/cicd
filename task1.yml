platform: linux

image_resource:
  type: registry-image
  source:
    repository: python
    tag: "3.10"

inputs:
- name: my-repo

outputs:
- name: local-output   # 👈 THIS is key

run:
  path: bash
  args:
    - -exc
    - |
      set -eux
      ls -ld /local-output || true
      python - <<'PY'
      from pathlib import Path
      p = Path("/local-output/myfile.txt")
      p.write_text("hello\n")
      print("WROTE:", p, "exists:", p.exists())
      PY
      ls -l /local-output
