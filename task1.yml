platform: linux

image_resource:
  type: registry-image
  source:
    repository: python
    tag: "3.10"

inputs:
- name: my-repo

outputs:
- name: local-output   # 👈 THIS is key

run:
  path: bash
  args:
    - -euc
    - |
      python my-repo/generate_files.py
      ls -l /local-output
      echo "Files in /output:"
      ls -l /local-output

      echo "Contents of hello.txt:"
      cat /local-output/hello.txt

      echo "Contents of data.csv:"
      cat /local-output/data.csv

      echo "Absolute path of hello.txt:"
      realpath local-output/hello.txt
